<svg xmlns="http://www.w3.org/2000/svg" width="860" height="550" viewBox="0 0 860 550" role="img" aria-labelledby="title description">
  <title id="title">Game compatibility and release plans</title>
  <desc id="description">ARC Raiders and THE FINALS are released: Working, full compatibility. Planned for later: Squad, some progress with some online compatibility still missing; WARDOGS, some progress; Helldivers 2, not started; GTA 6 (PC release), not started, only if it doesn’t already work through CrossOver.</desc>
  <style>
    text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .background{fill:#ffffff}.main{fill:#1f2328}.muted{fill:#656d76}.divider{stroke:#d8dee4;stroke-width:1}
    .working{fill:#1a7f37}.squad{fill:#bf8700}.wardogs{fill:#c65b57}.pending{fill:#8c959f}
    @media(prefers-color-scheme:dark){
      .background{fill:#0d1117}.main{fill:#e6edf3}.muted{fill:#919ba8}.divider{stroke:#30363d}
      .working{fill:#56b870}.squad{fill:#d9b34c}.wardogs{fill:#e08079}.pending{fill:#919ba8}
    }
  </style>
  <rect class="background" width="860" height="550"/>
  <text class="main" x="0" y="28" font-size="23" font-weight="600">Released</text>
  <text class="muted" x="0" y="65" font-size="14" font-weight="400">Game</text>
  <text class="muted" x="280" y="65" font-size="14" font-weight="400">Status</text>
  <text class="muted" x="490" y="65" font-size="14" font-weight="400">Notes</text>
  <path class="divider" d="M0 80H860"/>
  <text class="main" x="0" y="113" font-size="15" font-weight="600">ARC Raiders</text>
  <circle class="working" cx="285" cy="108" r="4"/>
  <text class="main" x="302" y="113" font-size="15" font-weight="400">Working</text>
  <text class="main" x="490" y="113" font-size="14" font-weight="400">Full compatibility</text>
  <path class="divider" d="M0 138H860"/>
  <text class="main" x="0" y="169" font-size="15" font-weight="600">THE FINALS</text>
  <circle class="working" cx="285" cy="164" r="4"/>
  <text class="main" x="302" y="169" font-size="15" font-weight="400">Working</text>
  <text class="main" x="490" y="169" font-size="14" font-weight="400">Full compatibility</text>
  <path class="divider" d="M0 194H860"/>
  <text class="main" x="0" y="252" font-size="23" font-weight="600">Planned for later</text>
  <text class="muted" x="0" y="289" font-size="14" font-weight="400">Game</text>
  <text class="muted" x="280" y="289" font-size="14" font-weight="400">Status</text>
  <text class="muted" x="490" y="289" font-size="14" font-weight="400">Notes</text>
  <path class="divider" d="M0 304H860"/>
  <text class="main" x="0" y="337" font-size="15" font-weight="600">Squad</text>
  <circle class="squad" cx="285" cy="332" r="4"/>
  <text class="main" x="302" y="337" font-size="15" font-weight="400">Some progress</text>
  <text class="main" x="490" y="337" font-size="14" font-weight="400">Some online compatibility still missing</text>
  <path class="divider" d="M0 362H860"/>
  <text class="main" x="0" y="393" font-size="15" font-weight="600">WARDOGS</text>
  <circle class="wardogs" cx="285" cy="388" r="4"/>
  <text class="main" x="302" y="393" font-size="15" font-weight="400">Some progress</text>
  <path class="divider" d="M0 418H860"/>
  <text class="main" x="0" y="449" font-size="15" font-weight="600">Helldivers 2</text>
  <circle class="pending" cx="285" cy="444" r="4"/>
  <text class="main" x="302" y="449" font-size="15" font-weight="400">Not started</text>
  <path class="divider" d="M0 474H860"/>
  <text class="main" x="0" y="505" font-size="15" font-weight="600">GTA 6 (PC release)</text>
  <circle class="pending" cx="285" cy="500" r="4"/>
  <text class="main" x="302" y="505" font-size="15" font-weight="400">Not started</text>
  <text class="main" x="490" y="505" font-size="14" font-weight="400">Only if it doesn’t already work</text>
  <text class="main" x="490" y="525" font-size="14">through CrossOver</text>
  <path class="divider" d="M0 549H860"/>
</svg>
